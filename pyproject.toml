[project]
name = "rfp-intelligence-engine"
version = "0.1.0"
description = "Moteur d'analyse d'appels d'offres, recherche hybride & synthèse LLM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "litellm>=1.50.0",
    "loguru>=0.7.3",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.2",
    "pypdf>=6.21.3",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "qdrant-client>=1.20.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.67.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rfp_engine"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
